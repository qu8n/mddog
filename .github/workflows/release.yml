name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches both versions
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          plugin=$(jq -er .version plugins/claude-code/.claude-plugin/plugin.json)
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$plugin" ]; then
            echo "::error::tag $tag, Cargo.toml $cargo, plugin.json $plugin: set all three to the same version"
            exit 1
          fi
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Package one tarball per architecture
        run: |
          for arch in arm64 x86_64; do
            case $arch in arm64) target=aarch64-apple-darwin ;; x86_64) target=x86_64-apple-darwin ;; esac
            cp "target/$target/release/mdd" mdd
            codesign --force --sign - mdd
            tar czf "mdd-macos-$arch.tar.gz" mdd
            shasum -a 256 "mdd-macos-$arch.tar.gz" > "mdd-macos-$arch.tar.gz.sha256"
          done
      - run: gh release create "$GITHUB_REF_NAME" mdd-macos-*.tar.gz mdd-macos-*.tar.gz.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
