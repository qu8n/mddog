name: release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The release notes list every commit since the last tag.
          fetch-depth: 0
      - name: Check the tag matches both versions
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          plugin=$(jq -er .version plugins/claude-code/.claude-plugin/plugin.json)
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$plugin" ]; then
            echo "::error::tag $tag, Cargo.toml $cargo, plugin.json $plugin: set all three to the same version"
            exit 1
          fi
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Package one tarball per architecture
        run: |
          for arch in arm64 x86_64; do
            case $arch in arm64) target=aarch64-apple-darwin ;; x86_64) target=x86_64-apple-darwin ;; esac
            cp "target/$target/release/mdd" mdd
            codesign --force --sign - mdd
            tar czf "mdd-macos-$arch.tar.gz" mdd
            shasum -a 256 "mdd-macos-$arch.tar.gz" > "mdd-macos-$arch.tar.gz.sha256"
          done
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          # GitHub's generated notes list only merged pull requests, and most changes go straight to main.
          {
            git log --no-merges --format='%H %s' "$prev..$GITHUB_REF_NAME" | while read -r sha subject; do
              case $subject in "chore: release "*) continue ;; esac
              # Credit outside contributors by their GitHub login, as GitHub's generated notes did.
              login=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.author.login // empty' || true)
              by=""
              if [ -n "$login" ] && [ "$login" != "$GITHUB_REPOSITORY_OWNER" ]; then by=" by @$login"; fi
              echo "- $subject (${sha:0:7})$by"
            done
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
          } > notes.md
      - name: Wait for the check on this commit to pass on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 120); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -b main -e push -c "$GITHUB_SHA" --json status,conclusion -q '.[0] // empty | "\(.status) \(.conclusion)"' || true)
            case $run in
              "completed success") exit 0 ;;
              completed*) echo "::error::the check on $GITHUB_SHA ended as: $run"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::no finished check on main for $GITHUB_SHA after 30 minutes"
          exit 1
      - run: gh release create "$GITHUB_REF_NAME" mdd-macos-*.tar.gz mdd-macos-*.tar.gz.sha256 --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Point the Homebrew formula at this release
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/qu8n/homebrew-tap.git" tap
          f=tap/Formula/mddog.rb
          for arch in arm64 x86_64; do
            sum=$(cut -d' ' -f1 "mdd-macos-$arch.tar.gz.sha256")
            # The sha256 line sits right under its url line.
            sed -i '' -E -e "s|/download/v[^/]+/mdd-macos-$arch|/download/$GITHUB_REF_NAME/mdd-macos-$arch|" \
              -e "/mdd-macos-$arch\.tar\.gz\"/{n;s/sha256 \"[0-9a-f]{64}\"/sha256 \"$sum\"/;}" "$f"
            grep -q "sha256 \"$sum\"" "$f" || { echo "::error::$arch checksum not written to $f"; exit 1; }
          done
          grep -c "/download/$GITHUB_REF_NAME/" "$f" | grep -qx 2 || { echo "::error::urls not updated in $f"; exit 1; }
          cd tap
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -am "mddog ${GITHUB_REF_NAME#v}"
          git push
