# Example mddog config. Copy it to ~/.config/mddog/config.toml, or to
# $XDG_CONFIG_HOME/mddog/config.toml if XDG_CONFIG_HOME is set.
# Every value here is the default, so you only need the keys you change.
# An unknown key or a bad value stops mddog with an error that names the key.

# One theme, such as "github-dark", or one for each macOS appearance as below.
# A theme is a built-in name (github-light, github-dark, obsidian-light, obsidian-dark)
# or a path to a theme file (any value that ends in .css or contains /). "light:obsidian-light,dark:obsidian-dark" looks like Obsidian.
# A theme file sets colors, fonts and sizes as tokens. A relative path starts from the config folder,
# and ~/ is your home. To write one, see docs/themes.md.
theme = "light:github-light,dark:github-dark"

# Reload the preview when the file changes.
live_reload = true

# Let d/u, f/b, Space, g/G and the other jump keys glide to the new position
# instead of jumping. j/k, the mouse wheel and search always move at once.
smooth_scroll = true

# How long a glide over one screen takes, in milliseconds. Half a screen takes half as long.
# A jump key pressed within 100 ms of the last one glides in 50 ms, so a held key keeps up.
glide_ms_per_page = 200

# Copy the text you select with a mouse drag or a double-click, as soon as you let go.
copy_on_select = false

# Keep a hidden mdd running with WebKit loaded, so the next preview opens faster.
# With false, mddog starts no background process, and each preview takes longer to open.
# mdd --prewarm-at-login then refuses to run.
prewarm = true

[file_list]
# The file extensions the file list (mdd, mdd FOLDER, Ctrl-p) shows, and that
# "Did you mean" picks from. This is the full list. Write each one without the dot.
# mdd FILE opens any text file, whatever its extension.
extensions = ["md", "markdown"]

[mermaid]
# pele (GitHub's frame and buttons, its own layout) or obsidian (draws like Obsidian).
# Unset, the theme's --mddog-mermaid picks: obsidian under the Obsidian themes, pele otherwise.
# engine = "pele"
