[package]
name = "mddog"
version = "1.0.1"
edition = "2024"
description = "Render Markdown in the terminal as a browser shows them, styled like GitHub by default"
license = "MIT"
publish = false

[[bin]]
name = "mdd"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.9"
irosashi = { version = "=0.3.0", default-features = false }
notify = "8"
png = "0.18.1"
webp = { version = "0.3", default-features = false }
serde_json = "1"
similar = "3.2.0"
tree-sitter = "0.27"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.2"
libc = "0.2"
signal-hook = "0.4.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls-no-default"] }

pulldown-cmark = { version = "0.13", default-features = false }
core-graphics = "0.25"
core-text = "22"
core-foundation = "0.10"
resvg = { version = "0.49", default-features = false, features = ["text", "raster-images"] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tree-sitter-nix = "0.3.0"

[build-dependencies]
miniz_oxide = "0.9"

[dev-dependencies]
regex = "1.13.1"

[profile.release]
# Full LTO with one codegen unit: 2.4 MB smaller than thin LTO. Unwinding stays on: the remote image
# pool catches a panicking fetch so it keeps its worker, and headless keeps going past a failed tile.
lto = "fat"
codegen-units = 1
strip = true

# Pedantic and nursery lints that pass cleanly and catch real waste. The rest of those groups
# mostly flag pixel-math casts and `#[must_use]`/`const fn` noise, so they stay off.
# `undocumented_unsafe_blocks` and `unnecessary_safety_comment` (restriction) keep each `unsafe` justified.
[lints.clippy]
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
manual_string_new = "warn"
needless_continue = "warn"
needless_for_each = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_safety_comment = "warn"
unnecessary_wraps = "warn"
unwrap_used = "warn"
